name: macOS checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check release script syntax
        run: |
          /bin/sh -n build.sh
          /bin/sh -n package-release.sh
          /bin/sh -n notarize-release.sh
          /bin/sh -n package-dmg.sh
      - name: Run offline tests
        run: /bin/sh test.sh
      - name: Build and verify universal release
        run: /bin/sh package-release.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-usage-macos-universal
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
